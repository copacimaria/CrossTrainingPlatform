version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Pachetele EF Core trebuie sa urce impreuna, altfel apar conflicte de versiune.
      efcore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
